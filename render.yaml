services:
  - type: web
    name: reflink-sl
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm && pnpm install && pnpm db:deploy && pnpm db:generate && pnpm admin:create && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: reflink-sl-db
          property: connectionString
      - key: ADMIN_NAME
        value: "RefLink Admin"
      - key: ADMIN_PHONE
        value: "+23270000000"
      - key: ADMIN_EMAIL
        value: "admin@reflink.sl"
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: reflink-sl-db
    databaseName: reflink_sl_db
    user: reflink_admin
    plan: free
